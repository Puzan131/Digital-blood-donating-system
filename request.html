<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="donateBlood-container">
        <div class="donate-header">
            <h1>Request Blood</h1>
        </div>
      <div id="donate-container">
        <div class="white-box">
          <div class="red-box">
            <div class="white-card">
              <div class="card-img">
                <img
                  src="https://hamrolifebank.com/contactform_external/images/New%20Project.png"
                />
              </div>
              <div class="form">
                <h1>Please send us your details</h1>
                <input type="text" placeholder="Your Full Name" />
                <input type="number" placeholder="Your contact Number" />
                <select>
                  <option>Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
                <select>
                  <option>Blood Group</option>
                  <option>A+</option>
                  <option>A-</option>
                  <option>AB-</option>
                  <option>AB+</option>
                  <option>B-</option>
                  <option>B+</option>
                  <option>O-</option>
                  <option>O+</option>
                  <option>unknown</option>
                </select>
                <label for="requisition">Requisition form (रक्त निवेदन फारम)</label>
                <input type="file" name="requisition" >
                <button type="submit">Submit</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
